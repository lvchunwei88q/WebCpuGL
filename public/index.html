<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebCpuGL</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* Centered square viewport: canvas always stays 1:1, sized to the
       smaller of window width/height. Letterboxed area stays black. */
    #stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      background: #000;
    }
    #view {
      /* intrinsic resolution = canvas.width/height (set by createDevice);
         CSS scales it to fit the window, letterboxed black, no distortion */
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      display: block;
    }
    #err {
      position: fixed; left: 12px; right: 12px; bottom: 12px;
      max-height: 40%; overflow: auto;
      background: rgba(0,0,0,.85); border: 1px solid #5a2a2a;
      color: #ffb4b4; padding: 8px 10px; border-radius: 4px;
      font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; display: none; z-index: 10;
    }
    #hud {
      position: fixed; top: 8px; left: 8px;
      font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: #9dffb0; background: rgba(0,0,0,.55);
      padding: 4px 8px; border-radius: 3px;
      pointer-events: none; z-index: 10;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
  </div>
  <pre id="err"></pre>
  <div id="hud"></div>
  <script type="module" src="/bootstrap.js"></script>
</body>
</html>
